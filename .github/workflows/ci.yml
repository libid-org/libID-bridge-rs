name: CI

# Two PR jobs: rust (fmt/clippy/test) and dco. Releases run their own
# workflow (release.yml), which re-runs the rust checks before publishing
# anything; the live ceremony suite runs in ceremony.yml.
#
# Every third-party action is pinned by commit SHA, with the tag in a
# comment, so a moved tag cannot change what executes.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Superseded pushes stop burning minutes immediately.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Every cargo invocation, not just clippy, treats warnings as errors.
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  # Incremental state is written, cached and never read in CI — every job
  # starts from a restored cache and never rebuilds the same crate twice.
  CARGO_INCREMENTAL: 0
  # Rust stable, pinned so a toolchain release cannot break CI mid-PR.
  RUST_VERSION: 1.97.1
  # Nightly is for `cargo +"$NIGHTLY" fmt` ONLY: rustfmt options like
  # `imports_granularity` are nightly-only, and stable rustfmt does not
  # reject them — it silently IGNORES them and reports success. Dated pin so
  # a nightly formatting change cannot turn the tree red overnight.
  NIGHTLY: nightly-2026-08-10

jobs:
  # ---------------------------------------------------------------------------
  # Rust: formatting, clippy, tests.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nightly first, stable second: this action makes the LAST toolchain it
      # installs the default, and everything except `cargo +"$NIGHTLY" fmt`
      # must run on the pinned stable.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting (nightly rustfmt)
        # +"$NIGHTLY", not +nightly: the bare channel name makes rustup fetch
        # the LATEST nightly (without the rustfmt component) instead of the
        # pinned one installed above.
        run: cargo +"$NIGHTLY" fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --all --locked

  # ---------------------------------------------------------------------------
  # DCO: every commit carries a Signed-off-by trailer, as CONTRIBUTING.md
  # promises. Plain git over the event's commit range — no marketplace
  # action, so there is nothing to pin and nothing to compromise.
  # ---------------------------------------------------------------------------
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the PR base and the push's `before` are reachable
          # only in a complete clone, and the repo is small.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            # Push to main. `before` is all zeros on a branch creation and
            # may be unreachable after a force push; in either case there is
            # no honest range, so fall back to the head commit alone rather
            # than failing on plumbing.
            zero="0000000000000000000000000000000000000000"
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
              && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE..$PUSH_AFTER"
            else
              echo "No usable push range; checking only the head commit."
              range="$PUSH_AFTER^!"
            fi
          fi

          # A remediation commit signs off on an earlier one it names, as the
          # standard DCO probot allows and `.github/dco.yml` permits: the
          # author adds a trailer they could not have written, without
          # rewriting history other branches are already built on. GitHub
          # authors a squash commit with the merging account's profile
          # identity while `git commit -s` signs off with the git identity,
          # so a branch whose every commit was signed off correctly can still
          # be squashed into one that carries no trailer matching its author.
          # A declaration counts only where the commit making it carries that
          # trailer itself.
          remediations=""
          for r in $(git rev-list --no-merges "$range"); do
            body=$(git log -1 --format=%B "$r")
            while read -r target who; do
              [ -n "$target" ] || continue
              if printf '%s' "$body" | grep -Fxiq "Signed-off-by: $who"; then
                remediations="$remediations$target $who
          "
              fi
            done <<EOF
          $(printf '%s' "$body" | sed -n -E 's/^I, (.+), hereby add my Signed-off-by to this commit: ([0-9a-f]{40})$/\2 \1/p')
          EOF
          done

          # Merge commits are exempt, as in the standard DCO probot: nobody
          # authors a merge, and the merged commits are themselves in range.
          missing=0
          for sha in $(git rev-list --no-merges "$range"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if git log -1 --format=%B "$sha" \
              | grep -Fxiq "Signed-off-by: $author"; then
              continue
            fi
            if printf '%s' "$remediations" | grep -Fxiq "$sha $author"; then
              echo "commit $sha is signed off by a later remediation commit."
              continue
            fi
            echo "::error::commit $sha lacks Signed-off-by matching its author: $author"
            git log -1 --format='  %h %s (%an)' "$sha"
            missing=1
          done

          if [ "$missing" -ne 0 ]; then
            echo "See CONTRIBUTING.md: every commit must certify the DCO."
            exit 1
          fi
          echo "All commits in $range are signed off."
