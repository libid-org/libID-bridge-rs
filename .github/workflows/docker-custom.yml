name: Docker (custom)

# Manual image build from any ref: "Run workflow" → pick the branch/tag and
# an optional tag suffix. Pushes
#   ghcr.io/libid-org/libid-bridge-rs:custom-<shortsha>[-<suffix>]
# Never touches `latest` or version tags — those come only from release.yml.
#
# Every third-party action is pinned by commit SHA, with the tag in a
# comment, so a moved tag cannot change what executes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag or SHA) to build"
        required: false
        default: ""
      tag-suffix:
        description: "Optional suffix appended to the image tag"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/libid-org/libid-bridge-rs
  LEGACY_IMAGE: ghcr.io/libid-org/libid-server-rs

jobs:
  docker:
    name: Build and push custom image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Inputs are read from env, not `${{ }}`-interpolated into the script:
      # a workflow_dispatch input is attacker-typed text and would otherwise
      # become shell source. The suffix is also validated to a safe charset.
      - name: Compute image tag
        id: tag
        env:
          SUFFIX: ${{ github.event.inputs.tag-suffix }}
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short=7 HEAD)
          tag="custom-${short_sha}"
          if [ -n "$SUFFIX" ]; then
            printf '%s' "$SUFFIX" | grep -qE '^[A-Za-z0-9._-]+$' \
              || { echo "::error::tag-suffix must match [A-Za-z0-9._-]+"; exit 1; }
            tag="${tag}-${SUFFIX}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building ${tag}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.LEGACY_IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
