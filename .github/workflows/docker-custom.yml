name: Custom Docker image

# Build and push an image from ANY ref (a branch, a tag, or a bare commit)
# without cutting a release. The image lands at
#   ghcr.io/libid-org/libid-bridge-rs:custom-<shortsha>[-<suffix>]
# and under the legacy name libid-server-rs, for deployments that pin it,
# so a testing deployment can point at exactly the code under review while
# `:latest` and the version tags keep meaning "released"; those come only
# from release.yml.
#
# Every third-party action is pinned by commit SHA, with the tag in a comment,
# so a moved tag cannot change what executes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag or commit SHA); the dispatching ref when empty"
        required: false
        default: ""
      tag-suffix:
        description: "Optional suffix: the image is pushed as custom-<shortsha>-<suffix>"
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE: ghcr.io/libid-org/libid-bridge-rs
  LEGACY_IMAGE: ghcr.io/libid-org/libid-server-rs

jobs:
  # ---------------------------------------------------------------------------
  # One linux/amd64 image, tagged from the commit it was built from.
  # ---------------------------------------------------------------------------
  docker:
    name: Build ${{ inputs.ref || github.ref_name }} → ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Inputs are read from env, not `${{ }}`-interpolated into the script: a
      # workflow_dispatch input is typed text and would otherwise become shell
      # source. The suffix becomes a docker tag, so it is held to a docker
      # tag's charset.
      - name: Image tag
        id: tag
        env:
          SUFFIX: ${{ inputs['tag-suffix'] }}
        run: |
          set -euo pipefail
          tag="custom-$(git rev-parse --short=7 HEAD)"
          if [ -n "$SUFFIX" ]; then
            if ! [[ "$SUFFIX" =~ ^[A-Za-z0-9._-]+$ ]]; then
              # The value is not echoed: a newline in it would start a
              # workflow command of its own.
              echo "::error::tag-suffix must match [A-Za-z0-9._-]+"
              exit 1
            fi
            tag="$tag-$SUFFIX"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The commit built, which is not the dispatching one when `ref`
          # names another.
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building $tag"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.LEGACY_IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tag.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
