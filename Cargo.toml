[package]
name = "libid-server-rs"
version = "0.2.2"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libID-server-rs"
description = "libID OAuth Bridge: publishes the ceremony configuration and serves the callback document."
publish = false

[dependencies]
# ── HTTP server / client ────────────────────────────────────────────────
axum = "0.8"

# ── everything else ─────────────────────────────────────────────────────
# The artifact retrieval: one pooled `client`/`http1` connection, over TLS
# whose trust anchors are compiled in.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = [
    "ring",
    "webpki-tokio",
    "http1",
    # A Distribution behind a proxy that has not moved to 1.3; without it the
    # handshake ends before a certificate is seen.
    "tls12",
] }
# What this deployment counts, in the Prometheus text exposition format.
prometheus-client = "0.25"

clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[features]
# The test fixtures (`libid_server_rs::fixtures`), for the integration tests.
fixtures = []

[dev-dependencies]
libid-server-rs = { path = ".", features = ["fixtures"] }
tower = { version = "0.5", features = ["util"] }
# A self-signed certificate for a fixture Distribution that speaks TLS.
rcgen = "0.13"
