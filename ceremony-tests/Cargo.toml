# A workspace of its own: the server's builds resolve none of the git graph
# the suite's prover and notary pull in, and its lockfile is this one.
[workspace]

[package]
name = "ceremony-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libID-server-rs"
description = "The live ceremony suite: real MPC-TLS sessions through a notary of its own against github.com, api.x.com and accounts.google.com, driven from a Chrome, with the deployment under test behind the `Deployment` interface."
publish = false

[dependencies]
# ── the prover and the notary ───────────────────────────────────────────
# One source, one revision: libid-tlsn is git-only and its API exposes
# libid-transcript types. The tlsn and mpz revisions they build on are pinned
# by the [patch] tables below.
libid-ceremony = { git = "https://github.com/libid-org/libID-rs", tag = "v0.6.0" }
libid-crypto = { git = "https://github.com/libid-org/libID-rs", tag = "v0.6.0" }
libid-tlsn = { git = "https://github.com/libid-org/libID-rs", tag = "v0.6.0" }
libid-transcript = { git = "https://github.com/libid-org/libID-rs", tag = "v0.6.0" }

# ── the Google ID token: RS256 over a JWKS fetched over verified TLS ────
ring = "0.17"
# The JWKS is fetched over verified TLS with the web's roots. `ring` is the
# one crypto provider in the graph, so rustls has exactly one to pick;
# declared as the bridge declares it, since a default-feature declaration
# would unify aws-lc-rs in.
hyper-rustls = { version = "0.27.10", default-features = false, features = [
    "ring",
    "webpki-tokio",
    "http1",
] }

# ── requests as the suite's prover sends them ───────────────────────────
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"

# ── the browser ─────────────────────────────────────────────────────────
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
totp-rs = "5"
tempfile = "3"
futures-util = "0.3"

# ── settings ────────────────────────────────────────────────────────────
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── the redirect fixture Chrome is checked against ──────────────────────
axum = "0.8"

# ── everything else ─────────────────────────────────────────────────────
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[dev-dependencies]
# The deployment under test: the routes its host reads. The host builds the
# binary from the same manifest.
libid-bridge-rs = { path = ".." }

# ── TLSNotary fork, for the live ceremony suite ─────────────────────────
# The tlsn the suite's prover and notary run: the notary's fork at the
# notary's revision, as its Cargo.toml pins them. tlsn refuses a session
# whose peer reports a different protocol version.
[patch."https://github.com/tlsnotary/tlsn"]
tlsn = { git = "https://github.com/libid-org/tlsn", rev = "94aaaf33f3361d1218f9abb4c82b5c58a9199460" }

# The mpz that tlsn revision builds on. Cargo ignores dependency-workspace
# patches, so the pin is repeated here.
[patch."https://github.com/privacy-ethereum/mpz"]
clmul = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
matrix-transpose = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-circuits = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-circuits-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-circuits-data = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-cointoss = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-cointoss-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-common = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
