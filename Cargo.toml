[workspace]
members = ["ceremony-tests"]
resolver = "2"

[package]
name = "libid-bridge-rs"
version = "0.4.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libID-bridge-rs"
description = "libID OAuth Bridge: publishes the ceremony configuration and serves the callback document."
publish = false

[dependencies]
# The live ceremony suite, a crate of its own, built only with the feature.
ceremony-tests = { path = "ceremony-tests", optional = true }

# ── HTTP server / client ────────────────────────────────────────────────
axum = "0.8"

# ── everything else ─────────────────────────────────────────────────────
# The artifact retrieval: one pooled `client`/`http1` connection, over TLS
# whose trust anchors are compiled in.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = [
    "ring",
    "webpki-tokio",
    "http1",
    # A Distribution behind a proxy that has not moved to 1.3; without it the
    # handshake ends before a certificate is seen.
    "tls12",
] }
# What this deployment counts, in the Prometheus text exposition format.
prometheus-client = "0.25"

clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[features]
# The live ceremony suite (`tests/ceremony`): real sessions against
# github.com and api.x.com through an in-process notary, and a browser for
# the authorization rungs.
live-ceremony = ["dep:ceremony-tests"]

[[test]]
name = "ceremony"
required-features = ["live-ceremony"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# The fixture Distribution hashes the code it serves, the way a Distribution's
# build does, and answers one body in chunks.
base64 = "0.22"
sha2 = "0.10"
futures-util = "0.3"
# The fixture builds a configuration the way the binary parses one.
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
axum = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
bytes = "1"

# A self-signed certificate for a fixture Distribution that speaks TLS.
rcgen = "0.13"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12", "logging"] }

# ── TLSNotary fork, for the live ceremony suite ─────────────────────────
# The tlsn the suite's prover and notary run: the notary's fork at the
# notary's revision, as its Cargo.toml pins them. tlsn refuses a session
# whose peer reports a different protocol version.
[patch."https://github.com/tlsnotary/tlsn"]
tlsn = { git = "https://github.com/libid-org/tlsn", rev = "94aaaf33f3361d1218f9abb4c82b5c58a9199460" }

# The mpz that tlsn revision builds on. Cargo ignores dependency-workspace
# patches, so the pin is repeated here.
[patch."https://github.com/privacy-ethereum/mpz"]
clmul = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
matrix-transpose = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
